[project]
name = "research-map-agent"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastembed>=0.5",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "trafilatura>=1.12",
  "python-dotenv>=1.0",
  "pypdf>=6.19.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
